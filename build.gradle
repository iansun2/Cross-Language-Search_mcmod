plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// CI overrides this with -Pmod_version=x.y.z when releasing
version = mod_version
group = mod_group_id

repositories {
    // EMI and Refined Storage come from Modrinth Maven; compile-only, never bundled into the jar
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // All integrations are optional: referenced at compile time only, and the matching mixins are skipped when the mod is absent.
    // Apothic Enchanting, Reverie Foundry and JECh mixins target classes by name, so they need no compile dependency.
    compileOnly "maven.modrinth:emi:${emi_version}"
    compileOnly "maven.modrinth:refined-storage:${refinedstorage_version}"

    // Load EMI as well when using runClient in the dev environment
    localRuntime "maven.modrinth:emi:${emi_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
    // Ship the license files inside the jar for modpack authors
    from("LICENSE") { rename { "LICENSE_${mod_id}" } }
    from("NOTICE") { rename { "NOTICE_${mod_id}" } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
