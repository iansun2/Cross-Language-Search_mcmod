name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          base=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }} --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: Cross-Language-Search-${{ steps.version.outputs.version }}
          path: build/libs/*.jar

      # Every push to main refreshes the rolling "latest" pre-release
      - name: Publish rolling "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest development build" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. Not a stable release and may contain bugs."

      # Pushing a v* tag publishes a versioned release
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "Cross-Language-Search ${GITHUB_REF_NAME}" \
            --generate-notes
